name: Cancel superseded McBoy compilation attempts
on:
  push:
    paths:
      - '.github/workflows/cancel-superseded.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cancel-old:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only known obsolete MCBOY macOS builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 42950893842 42950941303 42950946458 42950951083 42950955124 42950961618 42950966196 42951093443 42952873928; do
            state="$(gh api "/repos/$GH_REPO/actions/runs/$id" --jq .status || true)"
            if [[ "$state" == "queued" || "$state" == "in_progress" ]]; then
              echo "Cancel obsolete McBoy run $id ($state)"
              gh api --method POST "/repos/$GH_REPO/actions/runs/$id/cancel" --silent || echo "Could not cancel $id"
            else
              echo "Leave finished run $id unchanged ($state)"
            fi
          done
          echo "Verified v1.0 release run 42952014141 succeeded; only redundant alternate runner is canceled."
