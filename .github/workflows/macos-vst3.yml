name: Build McBoy macOS universal VST3

on:
  workflow_dispatch:
  push:
    paths:
      - 'McBoy-source.tar.xz.b64'
      - '.github/workflows/macos-vst3.yml'
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'Tests/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Extract complete McBoy project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, subprocess, pathlib
          data = base64.b64decode(pathlib.Path("McBoy-source.tar.xz.b64").read_text().strip(), validate=True)
          p = subprocess.run(["tar", "-xJf", "-"], input=data, check=True)
          print(f"Extracted McBoy source ({len(data)} compressed bytes)")
          PY
          # Keep the live GitHub workflow instead of the archived copy.
          git show HEAD:.github/workflows/macos-vst3.yml > .github/workflows/macos-vst3.yml
          test -f Source/PluginProcessor.cpp
          test -f Source/Core/ExtraEffects.h
          test -f scripts/build_macos.sh

      - name: Publish unpacked source files for browsing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source Tests Presets docs scripts CMakeLists.txt CMakePresets.json README.md LICENSES.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Expand McBoy source tree from verified archive"
            git push || echo "::warning::Could not push unpacked files; continuing build"
          fi

      - name: Build VST3 and execute macOS tests
        shell: bash
        run: bash scripts/build_macos.sh universal

      - name: Upload ready-to-install universal VST3
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: McBoy-macOS-universal-vst3
          path: |
            dist/McBoy-macOS-universal.vst3.zip
            dist/McBoy-macOS-universal.vst3.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload CMake/Xcode diagnostics if build fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: McBoy-failed-build-diagnostics
          path: |
            build-mac/CMakeFiles/CMakeConfigureLog.yaml
            build-mac/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
