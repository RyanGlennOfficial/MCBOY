name: Build McBoy macOS universal VST3

on:
  workflow_dispatch:
  push:
    paths:
      - 'McBoy-source.tar.xz.b64'
      - '.github/workflows/macos-vst3.yml'
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'Tests/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify checked-in source
        run: |
          test -f Source/Core/Engine.h
          test -f Source/Core/ExtraEffects.h
          test -f Tests/CoreSmoke.cpp
          test -f scripts/build_macos.sh

      - name: Build VST3 and execute macOS tests
        id: build
        continue-on-error: true
        shell: bash
        run: bash scripts/build_macos.sh universal

      - name: Upload ready-to-install universal VST3
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: McBoy-macOS-universal-vst3
          path: |
            dist/McBoy-macOS-universal.vst3.zip
            dist/McBoy-macOS-universal.vst3.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Report build status to repository
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          printf 'McBoy wet/dry fix build\\nRun: %s\\nCommit: %s\\nResult: %s\\nArtifacts: https://github.com/${{ github.repository }}/actions/runs/%s\\n' "$BUILD_RUN_ID" "$BUILD_SHA" "$BUILD_RESULT" "$BUILD_RUN_ID" > BUILD_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.txt
          git commit -m "Record McBoy macOS build $BUILD_RUN_ID: $BUILD_RESULT" || true
          git push || echo "::warning::Unable to push build status"

      - name: Fail workflow if tests fail
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Upload CMake/Xcode diagnostics if build fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: McBoy-failed-build-diagnostics
          path: |
            build-mac/CMakeFiles/CMakeConfigureLog.yaml
            build-mac/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
